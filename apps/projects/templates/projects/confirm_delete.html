{% extends "base.html" %}
{% block title %}Delete {{ project.name }} — TeamFlow{% endblock %}
{% block content %}
<div class="page-header"><h1>Delete "{{ project.name }}"?</h1></div>
<div class="card" style="max-width:480px;">
  <p>This will permanently remove the project and all of its tasks. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete project</button>
    <a class="btn secondary" href="{% url 'projects:detail' project.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
