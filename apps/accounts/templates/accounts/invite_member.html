{% extends "base.html" %}
{% block title %}Invite teammate — TeamFlow{% endblock %}
{% block content %}
<div class="page-header"><h1>Invite a teammate</h1></div>
<div class="card" style="max-width:420px;">
  <form method="post" class="stacked">
    {% csrf_token %}
    {% for field in form %}
      <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </p>
    {% endfor %}
    <button class="btn" type="submit">Send invitation</button>
  </form>
</div>
{% endblock %}
